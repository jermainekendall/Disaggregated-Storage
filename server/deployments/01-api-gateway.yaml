# api-gateway
# Test deployment: one replica. Background jobs are safe to scale (they claim
# work atomically), but one pod per service is plenty for a test cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: orchestrator
  labels:
    app: api-gateway
    tier: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: service
    spec:
      serviceAccountName: api-gateway-sa
      containers:
      - name: api-gateway
        image: orchestrator/api-gateway:dev
        imagePullPolicy: Never   # install.sh imports the image into containerd
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: orchestrator-config
        - secretRef:
            name: gateway-secrets   # JWT_SECRET
        env:
        - name: SERVICE_NAME
          value: "api-gateway"
        - name: RATE_LIMIT_REQUESTS_PER_MINUTE
          value: "600"
        - name: JWT_EXPIRY_MINUTES
          value: "60"
        - name: CORS_ALLOWED_ORIGINS
          value: "*"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
---
# Clients and peer agents reach the gateway on <node-ip>:30080.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: orchestrator
  labels:
    app: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080
