# peer-registry
# Test deployment: one replica. Background jobs are safe to scale (they claim
# work atomically), but one pod per service is plenty for a test cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: peer-registry
  namespace: orchestrator
  labels:
    app: peer-registry
    tier: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: peer-registry
  template:
    metadata:
      labels:
        app: peer-registry
        tier: service
    spec:
      serviceAccountName: peer-registry-sa
      containers:
      - name: peer-registry
        image: orchestrator/peer-registry:dev
        imagePullPolicy: Never   # install.sh imports the image into containerd
        ports:
        - containerPort: 50051
          name: grpc
        envFrom:
        - configMapRef:
            name: orchestrator-config
        env:
        - name: SERVICE_NAME
          value: "peer-registry"
        - name: GRPC_PORT
          value: "50051"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          grpc:
            port: 50051
          periodSeconds: 10
        livenessProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 10
          periodSeconds: 20
---
# Devices register over gRPC on <node-ip>:30051.
apiVersion: v1
kind: Service
metadata:
  name: peer-registry
  namespace: orchestrator
  labels:
    app: peer-registry
spec:
  type: NodePort
  selector:
    app: peer-registry
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
    nodePort: 30051
