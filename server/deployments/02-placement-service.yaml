---
# Placement Service - Selects optimal peers for file storage
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placement-service
  namespace: orchestrator
  labels:
    app: placement-service
    tier: service
spec:
  replicas: 5
  selector:
    matchLabels:
      app: placement-service
  template:
    metadata:
      labels:
        app: placement-service
        tier: service
    spec:
      serviceAccountName: placement-service
      containers:
      - name: placement-service
        image: placement-service:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 50051
          name: grpc
          protocol: TCP
        env:
        - name: GRPC_PORT
          value: "50051"
        - name: LOG_LEVEL
          value: "info"
        envFrom:
        - configMapRef:
            name: orchestrator-config
        - secretRef:
            name: database-credentials
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "nc -z localhost 50051 || exit 1"]
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "nc -z localhost 50051 || exit 1"]
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: placement-service
  namespace: orchestrator
  labels:
    app: placement-service
spec:
  type: ClusterIP
  selector:
    app: placement-service
  ports:
  - port: 50051
    targetPort: 50051
    protocol: TCP
    name: grpc
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: placement-service-pdb
  namespace: orchestrator
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: placement-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: placement-service-hpa
  namespace: orchestrator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: placement-service
  minReplicas: 5
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
