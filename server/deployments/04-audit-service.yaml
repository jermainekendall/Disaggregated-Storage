---
# Audit Service - Verifies shard integrity via challenge-response
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: orchestrator
  labels:
    app: audit-service
    tier: service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      labels:
        app: audit-service
        tier: service
    spec:
      serviceAccountName: audit-service
      containers:
      - name: audit-service
        image: audit-service:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 50053
          name: grpc
          protocol: TCP
        env:
        - name: GRPC_PORT
          value: "50053"
        - name: AUDIT_FREQUENCY_HOURS
          value: "168"
        - name: CHALLENGE_TIMEOUT_SECONDS
          value: "60"
        - name: MAX_AUDIT_FAILURES
          value: "3"
        - name: PENALTY_MULTIPLIER
          value: "2.0"
        - name: LOG_LEVEL
          value: "info"
        envFrom:
        - configMapRef:
            name: orchestrator-config
        - secretRef:
            name: database-credentials
        resources:
          requests:
            cpu: 300m
            memory: 256Mi
          limits:
            cpu: 600m
            memory: 512Mi
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "nc -z localhost 50053 || exit 1"]
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "nc -z localhost 50053 || exit 1"]
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: orchestrator
  labels:
    app: audit-service
spec:
  type: ClusterIP
  selector:
    app: audit-service
  ports:
  - port: 50053
    targetPort: 50053
    protocol: TCP
    name: grpc
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: audit-service-pdb
  namespace: orchestrator
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: audit-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: audit-service-hpa
  namespace: orchestrator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: audit-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
