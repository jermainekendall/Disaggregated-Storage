# audit-service
# Test deployment: one replica. Background jobs are safe to scale (they claim
# work atomically), but one pod per service is plenty for a test cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: orchestrator
  labels:
    app: audit-service
    tier: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      labels:
        app: audit-service
        tier: service
    spec:
      serviceAccountName: audit-service-sa
      containers:
      - name: audit-service
        image: orchestrator/audit-service:dev
        imagePullPolicy: Never   # install.sh imports the image into containerd
        ports:
        - containerPort: 50054
          name: grpc
        envFrom:
        - configMapRef:
            name: orchestrator-config
        env:
        - name: SERVICE_NAME
          value: "audit-service"
        - name: GRPC_PORT
          value: "50054"
        - name: CHALLENGE_TIMEOUT_SECONDS
          value: "900"
        - name: AUDIT_FAILURE_WINDOW_DAYS
          value: "30"
        - name: AUDIT_SCHEDULER_INTERVAL
          value: "1h"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          grpc:
            port: 50054
          periodSeconds: 10
        livenessProbe:
          grpc:
            port: 50054
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: orchestrator
  labels:
    app: audit-service
spec:
  type: ClusterIP
  selector:
    app: audit-service
  ports:
  - name: grpc
    port: 50054
    targetPort: 50054
