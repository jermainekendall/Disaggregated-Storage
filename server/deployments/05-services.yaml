# Services YAML for Android Device Testing
# File: 05-services-android.yaml
# Exposes: API Gateway (primary) + Peer Registry (for peer devices)

---
# API Gateway - Main entry point for Android app (EXPOSED)
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: orchestrator
  labels:
    app: api-gateway
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080  # Android devices connect here
    protocol: TCP
    name: http
  selector:
    app: api-gateway

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      serviceAccountName: default
      containers:
      - name: api-gateway
        image: localhost:5000/api-gateway:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          value: "cockroachdb-public"
        - name: DB_PORT
          value: "26257"
        - name: DB_NAME
          value: "orchestrator"
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          value: ""
        - name: HTTP_PORT
          value: "8080"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
# Peer Registry - For Android devices to register as peers (EXPOSED)
apiVersion: v1
kind: Service
metadata:
  name: peer-registry
  namespace: orchestrator
spec:
  type: NodePort
  ports:
  - port: 50051
    targetPort: 50051
    nodePort: 30051  # Android devices register here via gRPC
    name: grpc
  selector:
    app: peer-registry

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: peer-registry
  namespace: orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: peer-registry
  template:
    metadata:
      labels:
        app: peer-registry
    spec:
      serviceAccountName: default
      containers:
      - name: peer-registry
        image: localhost:5000/peer-registry:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 50051
        env:
        - name: DB_HOST
          value: "cockroachdb-public"
        - name: DB_PORT
          value: "26257"
        - name: DB_NAME
          value: "orchestrator"
        - name: DB_USER
          value: "root"
        - name: GRPC_PORT
          value: "50051"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

