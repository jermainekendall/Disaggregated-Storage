---
# Billing Service - Calculates earnings, processes payouts
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: orchestrator
  labels:
    app: billing-service
    tier: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
        tier: service
    spec:
      serviceAccountName: billing-service
      containers:
      - name: billing-service
        image: billing-service:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 50055
          name: grpc
          protocol: TCP
        env:
        - name: GRPC_PORT
          value: "50055"
        - name: BILLING_CYCLE_DAY
          value: "1"
        - name: PAYOUT_PROCESSING_DAY
          value: "5"
        - name: LOG_LEVEL
          value: "info"
        envFrom:
        - configMapRef:
            name: orchestrator-config
        - secretRef:
            name: database-credentials
        - secretRef:
            name: payment-api-keys
            optional: true
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "nc -z localhost 50055 || exit 1"]
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "nc -z localhost 50055 || exit 1"]
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: orchestrator
  labels:
    app: billing-service
spec:
  type: ClusterIP
  selector:
    app: billing-service
  ports:
  - port: 50055
    targetPort: 50055
    protocol: TCP
    name: grpc
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: billing-service-pdb
  namespace: orchestrator
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: billing-service
