---
# Repair Worker - Background job to repair degraded files
apiVersion: apps/v1
kind: Deployment
metadata:
  name: repair-worker
  namespace: orchestrator
  labels:
    app: repair-worker
    tier: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: repair-worker
  template:
    metadata:
      labels:
        app: repair-worker
        tier: worker
    spec:
      serviceAccountName: repair-worker
      containers:
      - name: repair-worker
        image: repair-worker:v1.0.0
        imagePullPolicy: IfNotPresent
        env:
        - name: WORKER_TYPE
          value: "repair"
        - name: POLL_INTERVAL_SECONDS
          value: "60"
        - name: BATCH_SIZE
          value: "10"
        - name: MAX_CONCURRENT_REPAIRS
          value: "5"
        - name: REPAIR_PRIORITY_THRESHOLD
          value: "10"
        - name: LOG_LEVEL
          value: "info"
        envFrom:
        - configMapRef:
            name: orchestrator-config
        - secretRef:
            name: database-credentials
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "ps aux | grep repair-worker | grep -v grep"]
          initialDelaySeconds: 30
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: repair-worker-pdb
  namespace: orchestrator
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: repair-worker
