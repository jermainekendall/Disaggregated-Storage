# repair-worker
# Test deployment: one replica. Background jobs are safe to scale (they claim
# work atomically), but one pod per service is plenty for a test cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: repair-worker
  namespace: orchestrator
  labels:
    app: repair-worker
    tier: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: repair-worker
  template:
    metadata:
      labels:
        app: repair-worker
        tier: service
    spec:
      serviceAccountName: worker-sa
      containers:
      - name: repair-worker
        image: orchestrator/repair-worker:dev
        imagePullPolicy: Never   # install.sh imports the image into containerd
        envFrom:
        - configMapRef:
            name: orchestrator-config
        env:
        - name: SERVICE_NAME
          value: "repair-worker"
        - name: POLL_INTERVAL_SECONDS
          value: "60"
        - name: BATCH_SIZE
          value: "10"
        - name: MAX_CONCURRENT_REPAIRS
          value: "5"
        - name: REBUILD_TIMEOUT_HOURS
          value: "24"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
