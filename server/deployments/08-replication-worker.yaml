---
# Replication Worker - Adaptive replication based on access patterns
apiVersion: apps/v1
kind: Deployment
metadata:
  name: replication-worker
  namespace: orchestrator
  labels:
    app: replication-worker
    tier: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: replication-worker
  template:
    metadata:
      labels:
        app: replication-worker
        tier: worker
    spec:
      serviceAccountName: replication-worker
      containers:
      - name: replication-worker
        image: replication-worker:v1.0.0
        imagePullPolicy: IfNotPresent
        env:
        - name: WORKER_TYPE
          value: "replication"
        - name: POLL_INTERVAL_SECONDS
          value: "300"
        - name: BATCH_SIZE
          value: "10"
        - name: HOT_TIER_THRESHOLD_ACCESSES
          value: "100"
        - name: WARM_TIER_THRESHOLD_ACCESSES
          value: "10"
        - name: MAX_REPLICATION_FACTOR
          value: "28"
        - name: LOG_LEVEL
          value: "info"
        envFrom:
        - configMapRef:
            name: orchestrator-config
        - secretRef:
            name: database-credentials
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "ps aux | grep replication-worker | grep -v grep"]
          initialDelaySeconds: 30
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: replication-worker-pdb
  namespace: orchestrator
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: replication-worker
