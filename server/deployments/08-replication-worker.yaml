# replication-worker
# Test deployment: one replica. Background jobs are safe to scale (they claim
# work atomically), but one pod per service is plenty for a test cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: replication-worker
  namespace: orchestrator
  labels:
    app: replication-worker
    tier: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: replication-worker
  template:
    metadata:
      labels:
        app: replication-worker
        tier: service
    spec:
      serviceAccountName: worker-sa
      containers:
      - name: replication-worker
        image: orchestrator/replication-worker:dev
        imagePullPolicy: Never   # install.sh imports the image into containerd
        envFrom:
        - configMapRef:
            name: orchestrator-config
        env:
        - name: SERVICE_NAME
          value: "replication-worker"
        - name: POLL_INTERVAL_SECONDS
          value: "300"
        - name: BATCH_SIZE
          value: "10"
        - name: HOT_TIER_THRESHOLD
          value: "100"
        - name: WARM_TIER_THRESHOLD
          value: "10"
        - name: ACCESS_WINDOW_DAYS
          value: "30"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
