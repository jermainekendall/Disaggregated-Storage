# analytics-worker
# Test deployment: one replica. Background jobs are safe to scale (they claim
# work atomically), but one pod per service is plenty for a test cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-worker
  namespace: orchestrator
  labels:
    app: analytics-worker
    tier: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-worker
  template:
    metadata:
      labels:
        app: analytics-worker
        tier: service
    spec:
      serviceAccountName: worker-sa
      containers:
      - name: analytics-worker
        image: orchestrator/analytics-worker:dev
        imagePullPolicy: Never   # install.sh imports the image into containerd
        envFrom:
        - configMapRef:
            name: orchestrator-config
        env:
        - name: SERVICE_NAME
          value: "analytics-worker"
        - name: POLL_INTERVAL_SECONDS
          value: "600"
        - name: CHURN_THRESHOLD
          value: "0.7"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
