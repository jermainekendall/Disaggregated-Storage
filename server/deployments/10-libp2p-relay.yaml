# libp2p circuit relay for peers behind NAT, on <node-ip>:30001.
#
# The relay's peer ID is part of every relay address peers store, so it must
# not change: the private key comes from the relay-identity Secret (created by
# install.sh with `relay-service -genkey`). Run exactly one replica: with two,
# the NodePort could send a peer to the replica whose ID it did not dial.
apiVersion: v1
kind: ConfigMap
metadata:
  name: relay-config
  namespace: orchestrator
data:
  # install.sh sets this to /ip4/<node-ip>/tcp/30001. Edit it if peers reach
  # the node through a different public address.
  ANNOUNCE_ADDRS: ""
  MAX_RESERVATIONS: "512"
  MAX_CIRCUITS: "256"
  RESERVATION_TTL: "1h"
  # 0 = no limit. Shards are large; limits would cut transfers off.
  CIRCUIT_LIMIT_DURATION: "0"
  CIRCUIT_LIMIT_BYTES: "0"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: libp2p-relay
  namespace: orchestrator
  labels:
    app: libp2p-relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: libp2p-relay
  template:
    metadata:
      labels:
        app: libp2p-relay
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
      - name: relay
        image: orchestrator/relay-service:dev
        imagePullPolicy: Never
        ports:
        - containerPort: 4001
          name: libp2p
        envFrom:
        - configMapRef:
            name: relay-config
        env:
        - name: PORT
          value: "4001"
        - name: KEY_FILE
          value: /keys/relay.key
        volumeMounts:
        - name: identity
          mountPath: /keys
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: "1"
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: 4001
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 4001
          initialDelaySeconds: 10
          periodSeconds: 20
      volumes:
      - name: identity
        secret:
          secretName: relay-identity
          items:
          - key: relay.key
            path: relay.key

---
apiVersion: v1
kind: Service
metadata:
  name: libp2p-relay
  namespace: orchestrator
  labels:
    app: libp2p-relay
spec:
  type: NodePort
  # Keep the client address so the relay's per-IP reservation limits work.
  externalTrafficPolicy: Local
  selector:
    app: libp2p-relay
  ports:
  - name: libp2p
    port: 4001
    targetPort: 4001
    nodePort: 30001
