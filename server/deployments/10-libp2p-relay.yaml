# Complete libp2p Relay Deployment with NAT Traversal
# File: relay-deployment.yaml

---
# ConfigMap for relay configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: relay-config
  namespace: orchestrator
  labels:
    app: libp2p-relay
data:
  MAX_RESERVATIONS: "512"
  MAX_CIRCUITS: "256"
  RESERVATION_TTL: "2h"
  ENABLE_METRICS: "true"

---
# Service for relay (NodePort for external access)
apiVersion: v1
kind: Service
metadata:
  name: libp2p-relay
  namespace: orchestrator
  labels:
    app: libp2p-relay
spec:
  type: NodePort
  ports:
  - port: 4001
    targetPort: 4001
    nodePort: 30001
    protocol: TCP
    name: libp2p
  selector:
    app: libp2p-relay

---
# ClusterIP Service for internal access
apiVersion: v1
kind: Service
metadata:
  name: libp2p-relay-internal
  namespace: orchestrator
  labels:
    app: libp2p-relay
spec:
  type: ClusterIP
  ports:
  - port: 4001
    targetPort: 4001
    protocol: TCP
    name: libp2p
  selector:
    app: libp2p-relay

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: libp2p-relay
  namespace: orchestrator
  labels:
    app: libp2p-relay
    version: v1.0.2
spec:
  replicas: 2  # Multiple relays for redundancy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: libp2p-relay
  template:
    metadata:
      labels:
        app: libp2p-relay
        version: v1.0.2
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4001"
    spec:
      serviceAccountName: default
      
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
      - name: relay
        image: localhost:5000/libp2p-relay:v1.0.2
        imagePullPolicy: IfNotPresent
        
        ports:
        - containerPort: 4001
          name: libp2p
          protocol: TCP
        
        args:
          - "--port=4001"
          - "--max-reservations=$(MAX_RESERVATIONS)"
          - "--max-circuits=$(MAX_CIRCUITS)"
          - "--reservation-ttl=$(RESERVATION_TTL)"
        
        env:
        - name: MAX_RESERVATIONS
          valueFrom:
            configMapKeyRef:
              name: relay-config
              key: MAX_RESERVATIONS
        - name: MAX_CIRCUITS
          valueFrom:
            configMapKeyRef:
              name: relay-config
              key: MAX_CIRCUITS
        - name: RESERVATION_TTL
          valueFrom:
            configMapKeyRef:
              name: relay-config
              key: RESERVATION_TTL
        - name: ENABLE_METRICS
          valueFrom:
            configMapKeyRef:
              name: relay-config
              key: ENABLE_METRICS
        - name: GOLOG_LOG_LEVEL
          value: "info"
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        livenessProbe:
          tcpSocket:
            port: 4001
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          tcpSocket:
            port: 4001
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Security context for container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      
      # Restart policy
      restartPolicy: Always

---
# HorizontalPodAutoscaler for scaling based on load
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: libp2p-relay-hpa
  namespace: orchestrator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: libp2p-relay
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30

---
# PodDisruptionBudget for high availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: libp2p-relay-pdb
  namespace: orchestrator
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: libp2p-relay
