# admin-console: web interface for operators, on http://<node-ip>:30088
#
# Sign in with an account whose role is 'admin'. install.sh creates the first
# one and stores its credentials in the admin-console-secrets Secret
# (ADMIN_BOOTSTRAP_EMAIL / ADMIN_BOOTSTRAP_PASSWORD), together with the
# cookie-signing SESSION_SECRET.
#
# TEST DEPLOYMENT: plain HTTP. Keep it on a trusted network, or put it behind
# TLS (e.g. an ingress with a certificate) and set COOKIE_SECURE=true.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-console
  namespace: orchestrator
  labels:
    app: admin-console
    tier: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-console
  template:
    metadata:
      labels:
        app: admin-console
        tier: service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
      - name: admin-console
        image: orchestrator/admin-console:dev
        imagePullPolicy: Never   # install.sh imports the image into containerd
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: orchestrator-config
        - secretRef:
            name: admin-console-secrets
        env:
        - name: SERVICE_NAME
          value: "admin-console"
        - name: PORT
          value: "8080"
        - name: SESSION_HOURS
          value: "8"
        - name: COOKIE_SECURE
          value: "false"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: admin-console
  namespace: orchestrator
  labels:
    app: admin-console
spec:
  type: NodePort
  selector:
    app: admin-console
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30088
