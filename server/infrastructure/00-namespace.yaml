# Kubernetes Namespace and Core Resources
# File: infrastructure/00-namespace.yaml

---
apiVersion: v1
kind: Namespace
metadata:
  name: orchestrator
  labels:
    app: distributed-storage
    environment: production

---
# Resource Quotas
apiVersion: v1
kind: ResourceQuota
metadata:
  name: orchestrator-quota
  namespace: orchestrator
spec:
  hard:
    requests.cpu: "50"
    requests.memory: 100Gi
    requests.storage: 500Gi
    persistentvolumeclaims: "20"
    services.loadbalancers: "2"

---
# Limit Ranges
apiVersion: v1
kind: LimitRange
metadata:
  name: orchestrator-limits
  namespace: orchestrator
spec:
  limits:
  - max:
      cpu: "4"
      memory: 8Gi
    min:
      cpu: 50m
      memory: 64Mi
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    type: Container

---
# Service Accounts
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway-sa
  namespace: orchestrator

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: placement-service-sa
  namespace: orchestrator

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: peer-registry-sa
  namespace: orchestrator

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-service-sa
  namespace: orchestrator

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: billing-service-sa
  namespace: orchestrator

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-sa
  namespace: orchestrator

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-password
  namespace: orchestrator
type: Opaque
stringData:
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

---
# Shared configuration for every service (read with envFrom).
# The test cluster runs CockroachDB in insecure mode: no TLS, no password.
apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestrator-config
  namespace: orchestrator
data:
  DB_HOST: "cockroachdb-public"
  DB_PORT: "26257"
  DB_NAME: "orchestrator"
  DB_USER: "root"
  DB_SSLMODE: "disable"

  # Service addresses (canonical port map)
  PEER_REGISTRY_ADDR: "peer-registry:50051"
  PLACEMENT_ADDR: "placement-service:50052"
  BILLING_ADDR: "billing-service:50053"
  AUDIT_ADDR: "audit-service:50054"
  KEY_METADATA_ADDR: "key-metadata:50055"

  # Liveness and health
  HEARTBEAT_TIMEOUT_SECONDS: "900"
  INACTIVE_PEER_HOURS: "168"
  MIN_HEALTH_SCORE: "70"

  # Audits
  AUDIT_FREQUENCY_HOURS: "168"
  MAX_AUDIT_FAILURES: "3"

  # Placement bounds
  MIN_REPLICATION_COUNT: "14"
  MAX_REPLICATION_COUNT: "28"

  # The JWT signing key and the relay identity are Secrets created by
  # install.sh (gateway-secrets, relay-identity); see deployments/README.md.
