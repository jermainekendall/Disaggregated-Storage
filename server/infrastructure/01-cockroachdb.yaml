# CockroachDB for the TEST deployment: one insecure node.
# File: infrastructure/01-cockroachdb.yaml
#
# The node runs `start-single-node`, which initializes the cluster itself, so
# no init Job is needed. (The old Job could never work: the pod is not Ready
# until the cluster is initialized, and its DNS name was only published for
# Ready pods, so the Job could not reach it.)
#
# To grow to 3 nodes later: switch the command to `start --join
# cockroachdb-0.cockroachdb,cockroachdb-1.cockroachdb,cockroachdb-2.cockroachdb`,
# set replicas: 3, and run `cockroach init` once against cockroachdb-0.

---
apiVersion: v1
kind: Service
metadata:
  name: cockroachdb-public
  namespace: orchestrator
  labels:
    app: cockroachdb
spec:
  ports:
  - port: 26257
    targetPort: 26257
    name: grpc
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: cockroachdb

---
apiVersion: v1
kind: Service
metadata:
  name: cockroachdb
  namespace: orchestrator
  labels:
    app: cockroachdb
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "_status/vars"
    prometheus.io/port: "8080"
spec:
  ports:
  - port: 26257
    targetPort: 26257
    name: grpc
  - port: 8080
    targetPort: 8080
    name: http
  clusterIP: None
  # Publish pod DNS names before they are Ready, so nodes can find each other
  # during startup (replaces the removed tolerate-unready-endpoints annotation).
  publishNotReadyAddresses: true
  selector:
    app: cockroachdb

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cockroachdb-budget
  namespace: orchestrator
spec:
  selector:
    matchLabels:
      app: cockroachdb
  maxUnavailable: 1

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cockroachdb
  namespace: orchestrator
spec:
  serviceName: "cockroachdb"
  replicas: 1  # test deployment: one node (see header to grow to 3)
  selector:
    matchLabels:
      app: cockroachdb
  template:
    metadata:
      labels:
        app: cockroachdb
        tier: database
    spec:
      # FIXED: Changed to "preferred" for single-node compatibility
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - cockroachdb
              topologyKey: kubernetes.io/hostname
      containers:
      - name: cockroachdb
        image: cockroachdb/cockroach:v23.1.13
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        ports:
        - containerPort: 26257
          name: grpc
        - containerPort: 8080
          name: http
        livenessProbe:
          httpGet:
            path: "/health"
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: "/health?ready=1"
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 2
        volumeMounts:
        - name: datadir
          mountPath: /cockroach/cockroach-data
        env:
        - name: COCKROACH_CHANNEL
          value: kubernetes-insecure
        command:
          - "/bin/bash"
          - "-ecx"
          - |
            exec /cockroach/cockroach start-single-node \
            --logtostderr \
            --insecure \
            --advertise-host $(hostname -f) \
            --http-addr 0.0.0.0 \
            --cache 25% \
            --max-sql-memory 25%
      terminationGracePeriodSeconds: 60
      # FIXED: Removed conflicting volumes section - StatefulSet uses volumeClaimTemplates
  volumeClaimTemplates:
  - metadata:
      name: datadir
    spec:
      accessModes:
        - "ReadWriteOnce"
      resources:
        requests:
          storage: 20Gi  # Reduced from 100Gi for testing
      storageClassName: fast-ssd
