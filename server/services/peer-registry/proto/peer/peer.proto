syntax = "proto3";

package peer;
option go_package = "orchestrator/proto/peer";

// Peer Registry service for managing storage peers
service PeerRegistry {
  // Register a new peer
  rpc RegisterPeer(PeerRegistration) returns (RegistrationResponse);
  
  // Send heartbeat to maintain peer status
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  
  // Get peer information
  rpc GetPeer(PeerRequest) returns (PeerInfo);
  
  // List active peers
  rpc ListPeers(ListPeersRequest) returns (PeerList);
}

// Peer registration request (UPDATED WITH LIBP2P FIELDS)
message PeerRegistration {
  string peer_id = 1;
  
  // libp2p fields (NEW)
  string libp2p_peer_id = 2;
  string multiaddr = 3;
  repeated string multiaddrs = 4;
  
  // Legacy fields (kept for compatibility)
  string ip_address = 5;
  int32 port = 6;
  
  // Capacity
  int64 total_capacity_bytes = 7;
  int64 available_capacity_bytes = 8;
  
  // Location/network
  string region = 9;
  string asn = 10;
  string timezone = 11;  // NEW
  
  // Version
  string version = 12;
}

// Registration response
message RegistrationResponse {
  bool success = 1;
  string message = 2;
  string peer_id = 3;
}

// Heartbeat request (UPDATED WITH LIBP2P FIELDS)
message HeartbeatRequest {
  string peer_id = 1;
  int64 available_capacity_bytes = 2;
  repeated string multiaddrs = 3;  // NEW
  double cpu_usage = 4;
  double memory_usage = 5;
}

// Heartbeat response
message HeartbeatResponse {
  bool success = 1;
  string message = 2;
}

// Request for peer information
message PeerRequest {
  string peer_id = 1;
}

// Peer information (UPDATED WITH LIBP2P FIELDS)
message PeerInfo {
  string peer_id = 1;
  
  // libp2p fields (NEW)
  string libp2p_peer_id = 2;
  string multiaddr = 3;
  repeated string multiaddrs = 4;
  
  // Legacy fields
  string ip_address = 5;
  int32 port = 6;
  
  // Capacity
  int64 total_capacity_bytes = 7;
  int64 available_capacity_bytes = 8;
  
  // Location
  string region = 9;
  string asn = 10;
  
  // Status
  string status = 11;
  double health_score = 12;
  int64 last_heartbeat = 13;
}

// Request to list peers
message ListPeersRequest {
  int32 limit = 1;
  string status = 2;  // "active", "inactive", "all"
}

// List of peers
message PeerList {
  repeated PeerInfo peers = 1;
  int32 total_count = 2;
}

