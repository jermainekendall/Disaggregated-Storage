syntax = "proto3";

package placement;
option go_package = "github.com/orchestrator/placement-service/proto/placement";

// Placement service for selecting optimal peers for file storage
service PlacementService {
  // Select peers for uploading a file with adaptive sharding
  rpc SelectPeersForUpload(UploadRequest) returns (PeerSelection);
}

// Request to select peers for a file upload
message UploadRequest {
  string file_id = 1;
  int64 file_size_bytes = 2;
  string owner_peer_id = 3;
  string storage_tier = 4;
}

// Response with selected peers and shard strategy
message PeerSelection {
  string file_id = 1;
  int32 shard_count = 2;
  int32 parity_shards = 3;
  repeated SelectedPeer peers = 4;
}

// Information about a selected peer for a specific shard
message SelectedPeer {
  string peer_id = 1;
  int32 shard_index = 2;
  string shard_type = 3;
  string peer_address = 4;
  double health_score = 5;
  string asn = 6;
  string region = 7;
}

